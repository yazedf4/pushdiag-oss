name: PushDiag OSS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-self-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Automated Unit & Crypto Test Suite
        run: npm test

      - name: Run Self-Audit Doctor on Examples
        run: node src/cli.js doctor --project ./examples --strict

      - name: Exercise composite GitHub Action on examples
        uses: ./
        with:
          project: ./examples
          strict: 'true'
